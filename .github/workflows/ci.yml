name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a running synthetic-resource test finish its normal teardown.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  portable:
    name: Portable helper checks (Linux, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-24
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, verified 2026-10-24
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record Node version
        run: node --version
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.mjs')
      - name: Run portable tests and unsupported-platform check
        run: >-
          node --test --test-concurrency=1
          tests/owned-resource.test.mjs tests/cli.test.mjs
          tests/metadata.test.mjs tests/registered-demo.test.mjs
      - name: Run scoped-resource example
        run: node examples/scoped-resource.mjs

  windows:
    name: Registered-service checks (Windows, Node 24)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-24
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, verified 2026-10-24
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record runtimes and select PowerShell
        run: |
          node --version
          $PSVersionTable.PSVersion.ToString()
          $psExe = (Get-Command pwsh.exe -CommandType Application | Select-Object -First 1).Source
          "TRG_TEST_POWERSHELL=$psExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check PowerShell syntax
        run: |
          $syntaxFailed = $false
          Get-ChildItem -LiteralPath 'skills/task-resource-guard/scripts' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message -ErrorAction Continue }
              $syntaxFailed = $true
            }
          }
          if ($syntaxFailed) { throw 'PowerShell syntax validation failed' }
      - name: Run unit tests, isolated cleanup tests and registered-service demo
        run: >-
          node --test --test-concurrency=1
          tests/owned-resource.test.mjs tests/cli.test.mjs
          tests/metadata.test.mjs tests/registered-cleanup.test.mjs
          tests/registered-demo.test.mjs
      - name: Run scoped-resource example
        run: node examples/scoped-resource.mjs
